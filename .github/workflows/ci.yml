name: Tests

# Runs on every push and pull request, and is called by the release build
# (see build-image.yml) so nothing is ever published from a red tree.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

# A second push supersedes the first: only the newest commit on a branch
# needs an answer.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor the code's syntax needs; 3.13 is what Raspberry
        # Pi OS trixie ships, and is therefore what the device actually runs.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the suite
        # The display tests render real frames through SDL's dummy video
        # driver — the same one the shipped image uses — so no X server or
        # sound device is needed. GLUCOCUBE_TOUCH=off keeps the evdev
        # reader away from the runner's /dev/input.
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          GLUCOCUBE_TOUCH: "off"
        run: |
          pytest -q \
            --cov=glucocube --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=75 \
            --junitxml=junit-${{ matrix.python }}.xml

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.python }}
          path: |
            junit-${{ matrix.python }}.xml
            coverage.xml
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Lint the app and the tests
        run: ruff check glucocube tests

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # install.sh is piped straight into bash from the README, and the
      # image stage scripts run inside pi-gen's chroot where a mistake is
      # only visible an hour into a build.
      - name: Shellcheck
        run: |
          shellcheck --version
          shellcheck install.sh \
            image/stage-glucocube/prerun.sh \
            image/stage-glucocube/00-glucocube/*.sh

  firmware:
    name: Firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    # Pinned to the ESP-IDF the firmware is developed against: a toolchain
    # that moves under a release is a release nobody can reproduce.
    container: espressif/idf:v5.3.2
    strategy:
      fail-fast: false
      matrix:
        board: [esp32-8048s050, sugarcube-s3]
    steps:
      - uses: actions/checkout@v4

      # Every board profile has to keep building, not just the one somebody
      # happens to have on their desk. The forecast the firmware runs is
      # checked against the Python's own answers by the test job above —
      # see tests/test_contract.py — so this is the compile, not the maths.
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          cd firmware
          idf.py -DGC_BOARD="${{ matrix.board }}" -B "build-${{ matrix.board }}" build

      - name: Report what it costs
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          cd firmware
          idf.py -DGC_BOARD="${{ matrix.board }}" -B "build-${{ matrix.board }}" size

  units:
    name: Service files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # systemd-analyze verify catches a unit that would fail to load on
      # the device — after it has been flashed to a card, which is a slow
      # way to find out.
      - name: Verify the systemd units
        run: |
          for unit in systemd/glucocube.service \
                      image/stage-glucocube/00-glucocube/files/glucocube.service; do
            echo "== $unit"
            cp "$unit" "/tmp/$(basename "$unit")"
            # Exit status covers load errors; the warnings it prints about
            # absent executables are expected on a runner without the app.
            systemd-analyze verify "/tmp/$(basename "$unit")" 2>&1 \
              | tee /tmp/verify.out
            ! grep -qiE "Failed to (parse|load)|Unknown (lvalue|section)" \
              /tmp/verify.out
          done
