name: Build SD card image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# The release step needs to create releases; the org's default token
# permissions are read-only.
permissions:
  contents: write

jobs:
  build:
    # Native ARM runner: no QEMU emulation needed, and much faster builds.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Bake the release version into the image so the updater can
      # compare it against future releases. Only plain vX.Y.Z tags: a
      # device stamped with an unparseable version stops seeing updates.
      - name: Stamp release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not a plain vX.Y.Z tag" >&2
            exit 1
          fi
          echo "__version__ = \"${GITHUB_REF_NAME#v}\"" > glucocube/_version.py

      # pi-gen only sees the stage directory, so the app source must be
      # inside it before the build starts.
      - name: Copy application into build stage
        run: |
          rm -rf image/stage-glucocube/00-glucocube/files/glucocube
          cp -r glucocube image/stage-glucocube/00-glucocube/files/
          find image/stage-glucocube -name __pycache__ -type d -exec rm -rf {} +

      - name: Build Raspberry Pi OS image with pi-gen
        id: build
        uses: usimd/pi-gen-action@v1
        with:
          image-name: glucocube
          # stage2 = Raspberry Pi OS Lite (no desktop), then our stage on top
          stage-list: stage0 stage1 stage2 ./image/stage-glucocube
          release: trixie
          hostname: glucocube
          username: gluco
          password: "glucocube"
          disable-first-boot-user-rename: 1
          enable-ssh: 1
          wpa-country: "US"
          compression: xz
          compression-level: 9
          verbose-output: true

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: glucocube-image
          path: ${{ steps.build.outputs.image-path }}

      - name: Attach image to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.image-path }}
          # Releases were going out with an empty description; the commit
          # log is a better starting point than nothing.
          generate_release_notes: true
