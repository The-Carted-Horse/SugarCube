# Captive portal for the SugarCube setup hotspot.
#
# Every name a joined phone looks up resolves to the device, so the
# connectivity check it makes the moment it joins lands on SugarCube's
# web server, which answers with a redirect to the setup page. That is
# what makes the phone open setup by itself instead of the user having
# to scan a second QR code off the device's screen.
#
# NetworkManager reads this directory only for "shared" connections. The
# setup hotspot is the only shared connection this device ever creates,
# so none of this applies while it is a normal Wi-Fi client.
address=/#/10.42.0.1
